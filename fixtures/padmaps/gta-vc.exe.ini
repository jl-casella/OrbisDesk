# W248: Grand Theft Auto: Vice City. Its camera is the mouse (DirectInput mouse, from raw input); the pad
# reaches it through DirectInput, whose right stick VC does not use. The right stick moves the mouse instead,
# as relative motion (native/hw_pad.c): mouse look, also at the edge of the screen. VC's own mouse
# sensitivity (Options > Controls) scales it further.
rstick = mouse
rstick_speed = 1200
rstick_deadzone = 24
