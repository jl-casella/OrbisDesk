; OrbisDesk pad profile for vlc.exe (W246), read by native/hw_pad.c from C:\orbis\padmaps\vlc.exe.ini
; when VLC starts as a guest (W213). The keys are VLC's hotkeys; the DVD menu is driven by the
; arrows and Enter (key-nav-*). The disc menu and the chapters are Shift combinations in VLC, which
; a profile cannot send, so tools/make-start-menu.py binds them to Home, Insert and End
; (--key-disc-menu, --key-chapter-prev, --key-chapter-next); Page Up/Down are VLC's 360 view keys.
; Lines are "source = key". The left stick stays the pointer (stick = mouse), as does the touchpad.
stick = mouse
up = up
down = down
left = left
right = right
cross = enter
circle = escape
square = space
triangle = home
l1 = insert
r1 = end
options = f
