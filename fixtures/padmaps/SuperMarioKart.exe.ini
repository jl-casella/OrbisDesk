; OrbisDesk pad profile for SuperMarioKart.exe (W181), read by native/hw_pad.c from
; C:\orbis\padmaps\SuperMarioKart.exe.ini. The game reads only the keyboard (its Read me):
; arrows drive, space uses an item, Enter selects, Esc quits at once (left unmapped).
