; OrbisDesk pad profile for The Lost Forest.exe (W213), read by native/hw_pad.c from
; C:\orbis\padmaps\The Lost Forest.exe.ini. The game reads keys (its Assembly-CSharp calls
; Input.GetKey with A/D or the arrows to move, W/S or up to climb, space to jump; Esc is left
; unmapped). Lines are "source = key". The left stick sends the arrows unless "stick = mouse";
; the touchpad stays the pointer for the menu, its click a left click.
; It works while hw_pad.c's game mode is off, which is the case with the pad as a generic HID
; gamepad (the default since W213); with C:\orbis\padhid-xinput.txt Unity polls XInput and game
; mode turns it off.
cross = space
up = up
down = down
left = left
right = right
triangle = enter
options = enter
