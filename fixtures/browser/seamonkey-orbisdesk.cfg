// SPDX-License-Identifier: LGPL-2.1-or-later (OrbisDesk: SeaMonkey's autoconfig file; Gecko skips this first line)
// fixtures/browser/seamonkey-orbisdesk.cfg, installed as orbisdesk.cfg in SeaMonkey's folder by
// tools/build-wine-hardware.py; defaults/pref/orbisdesk-gpu.js names it (general.config.filename).
//
// 04.30 (docs/SEAMONKEY_GPU.md): the GPU compositing and WebGL switches moved from user.js to SeaMonkey's
// defaults (orbisdesk-gpu.js), so a change in about:config stays across starts and uploads. Up to 04.29, user.js
// set them at every start, and Gecko saved them in the profile's prefs.js (a console where they were edited by hand
// has them on there). Once per profile, at the end of startup (prefs.js and user.js are read by then), their saved
// values are cleared so the defaults apply; orbisdesk.prefs-migration records that it ran.
try {
  Components.utils.import("resource://gre/modules/Services.jsm");
  Services.obs.addObserver(function orbisdeskPrefs(subject, topic) {
    Services.obs.removeObserver(orbisdeskPrefs, topic);
    var prefs = Services.prefs;
    if (prefs.getIntPref("orbisdesk.prefs-migration", 0) >= 1)
      return;
    ["layers.acceleration.disabled", "layers.acceleration.force-enabled",
     "webgl.disabled", "webgl.force-enabled"].forEach(function (name) {
      prefs.clearUserPref(name);
    });
    prefs.setIntPref("orbisdesk.prefs-migration", 1);
    prefs.savePrefFile(null);
  }, "final-ui-startup");
} catch (e) {
  Components.utils.reportError("orbisdesk.cfg: " + e);
}
