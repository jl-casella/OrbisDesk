name: Build PKG and release
run-name: OrbisDesk product ${{ github.event_name }} · ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish an experimental release after a successful clean build'
        type: boolean
        default: false
      cache_mode:
        description: 'Reuse verified dependency blocks, or cold to rebuild all dependencies'
        type: choice
        options: [reuse, cold]
        default: reuse
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: orbisdesk-product-release
  cancel-in-progress: false
jobs:
  authorize:
    if: github.event_name == 'workflow_dispatch' || vars.ORBISDESK_AUTO_RELEASE == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Owner-only manual runs; main-only publication
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          AUTO_ENABLED: ${{ vars.ORBISDESK_AUTO_RELEASE }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: bash tools/ci/authorize-product.sh
      - name: Allocate package version
        id: version
        env:
          VERSION_BASE: ${{ vars.ORBISDESK_RELEASE_VERSION_BASE || '400' }}
        run: |
          python3 - <<'PY'
          import os
          number = int(os.environ['VERSION_BASE']) + int(os.environ['GITHUB_RUN_NUMBER']) - 1
          if not 1 <= number <= 9999:
              raise SystemExit('SFO version namespace exhausted or invalid')
          major, minor = divmod(number, 100)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={major:02}.{minor:02}\n')
          PY
  checks:
    needs: authorize
    uses: ./.github/workflows/ci-pr.yml
  build:
    needs: [authorize, checks]
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      PRODUCT_CACHE_MODE: ${{ inputs.cache_mode || 'reuse' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare the product runner (same setup as the prebuilt blocks)
        timeout-minutes: 30
        uses: ./.github/actions/product-runner
      - name: Fingerprint product dependency blocks
        id: product-key
        run: python3 tools/ci/product_cache.py keys
      - name: Restore verified download candidates
        continue-on-error: true
        if: env.PRODUCT_CACHE_MODE == 'reuse'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .deps/product-downloads
          key: product-downloads-v1-${{ steps.product-key.outputs.downloads_key }}-complete-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            product-downloads-v1-${{ steps.product-key.outputs.downloads_key }}-complete-
            product-downloads-v1-${{ steps.product-key.outputs.downloads_key }}-partial-
      - name: Restore exact graphics snapshot candidate
        continue-on-error: true
        if: env.PRODUCT_CACHE_MODE == 'reuse'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .deps/product-cache/graphics
          key: product-graphics-v1-${{ steps.product-key.outputs.graphics_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: product-graphics-v1-${{ steps.product-key.outputs.graphics_key }}-
      - name: Restore exact host Wine snapshot candidate
        continue-on-error: true
        if: env.PRODUCT_CACHE_MODE == 'reuse'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .deps/product-cache/wine
          key: product-wine-v1-${{ steps.product-key.outputs.wine_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: product-wine-v1-${{ steps.product-key.outputs.wine_key }}-
      - name: Build product from pinned sources
        env:
          PRODUCT_VERSION: ${{ needs.authorize.outputs.version }}
          # read-only: downloads the prebuilt blocks pinned in prebuilt-blocks.lock.json on a cache miss
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/build-product.py --version "$PRODUCT_VERSION" --cache-mode "$PRODUCT_CACHE_MODE"
      - name: Verify reusable blocks even if a later product phase failed
        id: product-ready
        if: always() && !cancelled()
        run: python3 tools/ci/product_cache.py ready
      - name: Save verified product downloads
        continue-on-error: true
        if: always() && !cancelled() && steps.product-ready.outputs.downloads_ready == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .deps/product-downloads
          key: product-downloads-v1-${{ steps.product-key.outputs.downloads_key }}-${{ steps.product-ready.outputs.downloads_kind }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save completed graphics block
        continue-on-error: true
        if: always() && !cancelled() && steps.product-ready.outputs.graphics_ready == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .deps/product-cache/graphics
          key: product-graphics-v1-${{ steps.product-key.outputs.graphics_key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save completed host Wine block
        continue-on-error: true
        if: always() && !cancelled() && steps.product-ready.outputs.wine_ready == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .deps/product-cache/wine
          key: product-wine-v1-${{ steps.product-key.outputs.wine_key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify and assemble exact product assets
        run: python3 tools/ci/release.py assemble
      - name: Record final runner disk usage
        if: always()
        run: python3 tools/ci/runner_disk.py record
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: product-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            reports/ci/
            build/**/compile.log
            build/**/build.log
            build/**/configure.log
            build/**/package.log
            build/wine-boot/*.log
            build/wine-boot/*.json
            build/wine-server/*.log
            build/wine-server/*.json
            .deps/wine/runtime/driver.log
            .deps/wine/runtime/configure.log
            .deps/wine/runtime/make-*.log
            .deps/wine/runtime/build/config.log
            reports/increment15/host-build/*.log
            reports/increment15/host-build/*.json
            reports/increment15/prefix-producer/*/*.log
            reports/increment15/prefix-producer/*/report.json
            .deps/wine/ps4-unix/configure.log
            .deps/wine/ps4-unix/config.log
      - name: Product candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: product-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: out/release/
  publish:
    needs: [authorize, checks, build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: product-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/release
      - name: Publish tag, notes and verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/release.py publish
