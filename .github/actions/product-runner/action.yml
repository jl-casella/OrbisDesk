name: OrbisDesk product runner
description: >
  The one runner setup of product and prebuilt-block jobs. The dependency-block keys hash this
  environment (tools, packages, PATH), so both workflows must prepare it identically.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
      with:
        dotnet-version: '8.0.x'
    - name: Reclaim unused hosted toolchains and verify disk budget
      shell: bash
      run: python3 tools/ci/runner_disk.py prepare
    - name: Install clean runner prerequisites
      shell: bash
      run: bash tools/ci/install-product.sh
